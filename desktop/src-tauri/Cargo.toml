[package]
name = "app"
version = "1.0.0"
description = "OhMyCrypto: local-first crypto market monitoring, opportunity verification, feed diagnostics, and execution cost comparison."
authors = ["OhMyCrypto contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/JeremyL691/OhMyCrypto"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ohmycrypto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }

[profile.release]
strip = true
lto = true
codegen-units = 1
